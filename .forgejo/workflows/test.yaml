name: Test Quarkus Backend

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.forgejo/workflows/test.yaml'

jobs:
  build:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: https://github.com/actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: https://github.com/stCarolas/setup-maven@v5
        with:
          maven-version: 3.10.2

      - name: Run maven test
        run: mvn clean test -fae

      - name: Run maven package
        run: mvn package -Dquarkus.container-image.build=false -Dquarkus.container-image.push=false
