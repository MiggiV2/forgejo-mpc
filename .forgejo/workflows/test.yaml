name: Test Quarkus Backend

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.forgejo/workflows/test.yaml'

jobs:
  build:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: https://github.com/stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: 3.9.10

      - name: Run maven test
        run: mvn clean test -fae

      - name: Run maven package
        run: mvn package -Dquarkus.container-image.build=false -Dquarkus.container-image.push=false
